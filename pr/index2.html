<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>E-Learning Course viewer</title>
  <style>
    :root {
      color-scheme: light;
      --line: #e2e5e9;
      --muted: #687385;
      --blue: #2563eb;
      --bg: #f5f7fa;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      margin: 0;
      font-family: Arial, "Malgun Gothic", sans-serif;
      color: #182230;
    }

    body {
      background: var(--bg);
    }

    .app {
      height: 100vh;
      min-height: 420px;
      display: flex;
      flex-direction: column;
    }

    main {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: 320px minmax(0, 1fr);
    }

    aside {
      min-height: 0;
      display: flex;
      flex-direction: column;
      background: #fff;
      border-right: 1px solid var(--line);
    }

    .side-head {
      padding: 16px 14px 12px;
      border-bottom: 1px solid var(--line);
    }

    .side-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      font-size: 14px;
      font-weight: 700;
    }

    #count {
      font-size: 12px;
      color: var(--muted);
      font-weight: 400;
    }

    .search-wrap {
      position: relative;
    }

    #search {
      width: 100%;
      height: 38px;
      padding: 0 12px 0 34px;
      border: 1px solid #d8dde5;
      border-radius: 8px;
      font-size: 13px;
      outline: none;
    }

    #search:focus {
      border-color: #7aa2ff;
      box-shadow: 0 0 0 3px #2563eb18;
    }

    .search-icon {
      position: absolute;
      left: 11px;
      top: 10px;
      color: #8993a3;
      font-size: 15px;
    }

    #list {
      position: relative;
      flex: 1;
      overflow: auto;
      padding: 7px;
    }

    .item {
      width: 100%;
      display: block;
      text-align: left;
      padding: 11px 10px;
      margin: 2px 0;
      border: 0;
      border-radius: 7px;
      background: transparent;
      cursor: pointer;
      color: #283344;
      font-size: 13px;
      line-height: 1.45;
    }

    .item:hover {
      background: #f4f6fa;
    }

    .item.active {
      background: #eaf1ff;
      color: #1749b8;
      font-weight: 700;
    }

    .item .path {
      display: block;
      margin-top: 4px;
      color: #7a8595;
      font-size: 11px;
      font-weight: 400;
      overflow-wrap: anywhere;
    }

    .item.active .path {
      color: #5274bd;
    }

    .viewer {
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      background: #edf0f4;
    }

    .viewer-head {
      min-height: 58px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 16px;
      background: #fff;
      border-bottom: 1px solid var(--line);
    }

    .current {
      flex: 1;
      min-width: 0;
    }

    #currentTitle {
      font-size: 14px;
      font-weight: 700;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    #currentUrl {
      margin-top: 4px;
      color: var(--muted);
      font-size: 11px;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .open-btn {
      flex-shrink: 0;
      border: 1px solid #d7dce4;
      background: #fff;
      border-radius: 7px;
      padding: 8px 10px;
      font-size: 12px;
      cursor: pointer;
      color: #283344;
      text-decoration: none;
    }

    .open-btn:hover {
      background: #f7f8fa;
    }

    .frame-wrap {
      position: relative;
      flex: 1;
      min-height: 0;
    }

    #pageFrame {
      width: 100%;
      height: 100%;
      border: 0;
      background: #fff;
    }

    .empty {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 30px;
      color: var(--muted);
    }

    .empty-inner {
      max-width: 420px;
    }

    .empty .symbol {
      font-size: 35px;
      margin-bottom: 12px;
    }

    .empty strong {
      display: block;
      color: #354052;
      font-size: 15px;
      margin-bottom: 8px;
    }

    .empty p {
      font-size: 13px;
      line-height: 1.65;
      margin: 0;
    }

    .error {
      padding: 16px;
      margin: 10px;
      border-radius: 8px;
      background: #fff1f0;
      color: #a22b22;
      font-size: 13px;
      line-height: 1.6;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    @media (max-width: 760px) {
      main {
        grid-template-columns: minmax(150px, 38%) minmax(0, 1fr);
      }

      .viewer-head {
        padding: 9px 10px;
        gap: 7px;
      }

      .open-btn {
        padding: 7px 8px;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <main>
      <aside>
        <div class="side-head">
          <div class="side-title">
            <span>강좌 목록</span>
            <span id="count">불러오는 중…</span>
          </div>

          <div class="search-wrap">
            <span class="search-icon">⌕</span>
            <input
              id="search"
              type="search"
              placeholder="강좌명 검색…"
              autocomplete="off"
              aria-label="강좌명 검색"
            >
          </div>
        </div>

        <div id="list" aria-live="polite">
          <div class="empty">
            <div class="empty-inner">
              <strong>시트 연결 확인 중</strong>
              <p>Google Sheets에서 강좌 목록을 불러오고 있어요.</p>
            </div>
          </div>
        </div>
      </aside>

      <section class="viewer">
        <div class="viewer-head">
          <div class="current">
            <div id="currentTitle">강좌를 선택하세요</div>
            <div id="currentUrl">선택한 페이지 주소가 여기에 표시됩니다.</div>
          </div>

          <a
            id="openLink"
            class="open-btn"
            href="#"
            target="_blank"
            rel="noopener"
            style="display: none"
          >새 창에서 열기(bm2) ↗</a>
          <a
  id="openLink2"
  class="open-btn"
  href="#"
  target="_blank"
  rel="noopener"
  style="display: none"
>새 창에서 열기(bm) ↗</a>
        </div>

        <div class="frame-wrap">
          <div id="placeholder" class="empty">
            <div class="empty-inner">
              <div class="symbol">▣</div>
              <strong>홍보 페이지 미리보기</strong>
              <p>
                왼쪽 목록에서 강좌를 선택하면<br>
                이 영역에 해당 페이지가 표시됩니다.
              </p>
            </div>
          </div>

          <iframe
            id="pageFrame"
            title="강좌 홍보 페이지"
            style="display: none"
            referrerpolicy="strict-origin-when-cross-origin"
          ></iframe>
        </div>
      </section>
    </main>
  </div>

  <script>
    // Google Sheets 설정입니다.
    const SHEET_ID = "1fcwsqTkb8zcJYac0od7KeOuwPh4lLqW_eUK3r0R58_A";
    const SHEET_GID = "0";
    const BASE_URL = "https://bm2.cyber.co.kr/";
    const BASE_URL2 = "https://bm.cyber.co.kr/";

    const listEl = document.getElementById("list");
    const countEl = document.getElementById("count");
    const searchEl = document.getElementById("search");
    const frame = document.getElementById("pageFrame");
    const placeholder = document.getElementById("placeholder");
    const openLink = document.getElementById("openLink");
    const openLink2 = document.getElementById("openLink2");
    const currentTitle = document.getElementById("currentTitle");
    const currentUrl = document.getElementById("currentUrl");

    let courses = [];
    let selectedUrl = "";

    function makeAbsoluteUrl(path) {
      const value = String(path || "").trim();

      if (!value) {
        return "";
      }

      if (/^https?:\/\//i.test(value)) {
        return value;
      }

      return (
        BASE_URL.replace(/\/+$/, "") +
        "/" +
        value.replace(/^\/+/, "")
      );
    }

    function showError(message) {
      countEl.textContent = "오류 발생";
      listEl.innerHTML = "";

      const box = document.createElement("div");
      box.className = "error";
      box.textContent = message;

      listEl.appendChild(box);
    }

    function parseGviz(text) {
      // 응답 형식은 google.visualization.Query.setResponse({...}); 입니다.
      const start = text.indexOf("{");
      const end = text.lastIndexOf("}");

      if (start < 0 || end < start) {
        throw new Error(
          "시트 응답을 읽을 수 없습니다. 시트 주소와 접근 권한을 확인해 주세요."
        );
      }

      const data = JSON.parse(text.slice(start, end + 1));

      if (data.status === "error") {
        const message = (data.errors || [])
          .map(error => error.detailed_message || error.message)
          .join(" ");

        throw new Error(message || "Google Sheets에서 오류를 반환했습니다.");
      }

      const cols = (data.table && data.table.cols) || [];
      const rows = (data.table && data.table.rows) || [];

      const titles = cols.map(col =>
        String(col.label || col.id || "").trim().toLowerCase()
      );

      // 열 이름을 찾지 못하면 A열(title), E열(url)을 사용합니다.
      let titleIndex = titles.indexOf("title");
      let urlIndex = titles.indexOf("url");

      if (titleIndex < 0) {
        titleIndex = 0;
      }

      if (urlIndex < 0) {
        urlIndex = 4;
      }

      return rows
        .map(row => {
          const cells = row.c || [];

          const titleCell = cells[titleIndex];
          const urlCell = cells[urlIndex];

          const title = titleCell
            ? (titleCell.f || titleCell.v)
            : "";

          const path = urlCell
            ? (urlCell.f || urlCell.v)
            : "";

          return {
            title: String(title || "").trim(),
            url: makeAbsoluteUrl(path)
          };
        })
        .filter(item => item.title && item.url);
    }

    function renderList() {
      const keyword = searchEl.value.trim().toLocaleLowerCase();

      const filtered = courses.filter(course =>
        course.title.toLocaleLowerCase().includes(keyword)
      );

      countEl.textContent = `${filtered.length}개`;
      listEl.innerHTML = "";

      if (!filtered.length) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.innerHTML =
          '<div class="empty-inner">' +
            "<strong>검색 결과가 없습니다</strong>" +
            "<p>다른 검색어를 입력해 주세요.</p>" +
          "</div>";

        listEl.appendChild(empty);
        return;
      }

      filtered.forEach(course => {
        const button = document.createElement("button");
        button.type = "button";
        button.className =
          "item" + (course.url === selectedUrl ? " active" : "");

        const title = document.createElement("span");
        title.textContent = course.title;

        const path = document.createElement("span");
        path.className = "path";
        path.textContent = course.url.replace(
          /^https:\/\/bm\.cyber\.co\.kr\//,
          ""
        );

        button.append(title, path);

        button.addEventListener("click", () => {
          selectCourse(course);
        });

        listEl.appendChild(button);
      });
    }

    function selectCourse(course) {
      selectedUrl = course.url;

      currentTitle.textContent = course.title;
      currentUrl.textContent = course.url;

      
openLink.href = course.url;
openLink.style.display = "inline-block";

openLink2.href = BASE_URL2 + course.url.replace(BASE_URL, "");
openLink2.style.display = "inline-block";


      placeholder.style.display = "none";
      frame.style.display = "block";
      frame.src = course.url;

      renderList();
    }

    async function loadCourses() {
      const endpoint =
        `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq` +
        `?gid=${SHEET_GID}&range=A2:G&tqx=out:json`;

      try {
        const response = await fetch(endpoint, {
          cache: "no-store"
        });

        if (!response.ok) {
          throw new Error(
            `Google Sheets 응답 오류 (${response.status})`
          );
        }

        const text = await response.text();
        courses = parseGviz(text);

        if (!courses.length) {
          showError(
            "시트에서 title과 url이 채워진 행을 찾지 못했습니다.\n" +
            "A열의 강좌명과 E열의 URL을 확인해 주세요."
          );
          return;
        }

        renderList();

        // 첫 번째 강좌를 자동으로 표시합니다.
        selectCourse(courses[0]);
      } catch (error) {
        console.error(
          "강좌 목록 로딩 또는 화면 표시 오류:",
          error
        );

        showError(
          "강좌 목록을 불러오거나 화면에 표시하는 중 오류가 발생했습니다.\n\n" +
          "오류: " +
          (error && error.message
            ? error.message
            : "알 수 없는 오류")
        );
      }
    }

    searchEl.addEventListener("input", renderList);
    loadCourses();
  </script>
</body>
</html>
