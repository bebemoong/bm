<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>페이지</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
}

.sidebar {
  position: fixed;
  left: 0;
  top: 0;
  width: 180px;
  height: 100vh;
  padding: 20px;
  background: #f5f5f5;
}

.sidebar button {
  display: block;
  width: 100%;
  margin-bottom: 10px;
  padding: 12px;
  border: 0;
  cursor: pointer;
}

.content {
  margin-left: 180px;
  min-height: 100vh;
}

.content iframe {
  width: 100%;
  height: 100vh;
  border: 0;
}
</style>
</head>

<body>

<div class="sidebar">
  <button onclick="goPage('page1.html')">메뉴구조안</button>
  <button onclick="goPage('page2.html')">기존</button>
  <button onclick="goPage('page3.html')">v23</button>
</div>

<div class="content">
  <iframe id="pageFrame" src="page1.html"></iframe>
</div>

<script>
function goPage(page) {
  document.getElementById('pageFrame').src = page;
}
</script>

</body>
</html>
