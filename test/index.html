<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            height: 100vh;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            overflow: hidden;
        }

        /* 왼쪽 사이드바 영역 */
        .sidebar {
            width: 400px;
            background-color: #f8fafc;
            border-right: 1px solid #e2e8f0;
            display: flex;
            flex-direction: column;
        }
        .sidebar-header {
            padding: 16px;
            background-color: #1e293b;
            color: white;
            font-size: 16px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .menu-container {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        /* 오른쪽 아이프레임 영역 */
        .content {
            flex: 1;
            background-color: #f1f5f9;
            display: flex;
            flex-direction: column;
        }
        .content-header {
            padding: 12px 16px;
            background-color: #ffffff;
            border-bottom: 1px solid #e2e8f0;
            font-size: 14px;
            color: #475569;
            font-weight: 500;
        }
        .content-header strong {
            color: #2563eb;
        }
        iframe {
            width: 100%;
            flex: 1;
            border: none;
            background-color: #ffffff;
        }

        /* 아코디언 메뉴 스타일 */
        .menu-group {
            margin-bottom: 8px;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            background: white;
            overflow: hidden;
        }
        .menu-header {
            padding: 12px;
            background-color: #f1f5f9;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.2s;
        }
        .menu-header:hover {
            background-color: #e2e8f0;
        }
        .menu-title {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .link-icon {
            font-size: 12px;
            color: #2563eb;
        }
        .menu-list {
            display: none;
            padding: 10px;
        }
        .menu-list.active {
            display: block;
        }

        /* 시나리오 항목 스타일 */
        .scenario-item {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 10px 8px;
            border-bottom: 1px dashed #e2e8f0;
            font-size: 13px;
            transition: background 0.2s;
        }
        .scenario-item:hover {
            background-color: #f8fafc;
        }
        .scenario-item:last-child {
            border-bottom: none;
        }
        .scenario-info {
            flex: 1;
            cursor: pointer;
            color: #334155;
            padding-right: 10px;
            line-height: 1.4;
        }
        .scenario-info:hover {
            color: #2563eb;
            font-weight: 600;
        }
        .scenario-id {
            display: inline-block;
            width: 45px;
            color: #64748b;
            font-size: 12px;
            font-weight: bold;
        }

        /* 버튼 스타일 */
        .btn-group {
            display: flex;
            gap: 4px;
            flex-shrink: 0;
        }
        button {
            cursor: pointer;
            border: 1px solid #cbd5e1;
            background: white;
            border-radius: 4px;
            padding: 4px 8px;
            font-size: 11px;
            color: #475569;
        }
        button:hover {
            background: #f1f5f9;
        }
        .btn-add {
            width: 100%;
            margin-top: 10px;
            padding: 8px;
            background-color: #eff6ff;
            color: #2563eb;
            border: 1px dashed #93c5fd;
            font-weight: bold;
        }
        .btn-add:hover {
            background-color: #dbeafe;
        }
    </style>
</head>

        const container = document.getElementById('menu-container');
        const mainFrame = document.getElementById('main-frame');
        const currentInfo = document.getElementById('current-info');

        function renderMenu() {
            container.innerHTML = ''; 

            menuData.forEach((group, groupIndex) => {
                const groupDiv = document.createElement('div');
                groupDiv.className = 'menu-group';

                // 대메뉴 헤더 영역
                const headerDiv = document.createElement('div');
                headerDiv.className = 'menu-header';
                headerDiv.innerHTML = `
                    <div class="menu-title">
                        <span>${group.title}</span> <span class="link-icon">🔗</span>
                    </div>
                    <span>▼</span>
                `;
                
                const listDiv = document.createElement('div');
                listDiv.className = 'menu-list';
                
                // 첫 화면 접속 시 1번 그룹 열기 + 화면 연결
                if(groupIndex === 0) {
                    listDiv.classList.add('active');
                    mainFrame.src = group.url;
                    currentInfo.innerHTML = `<strong>${group.title}</strong> 메인 화면 연동 중...`;
                }

                // 대메뉴 클릭 이벤트 (아코디언 토글 + iframe URL 변경)
                headerDiv.onclick = () => {
                    // 아코디언 열고 닫기
                    listDiv.classList.toggle('active');
                    const icon = headerDiv.querySelector('span:last-child');
                    icon.textContent = listDiv.classList.contains('active') ? '▲' : '▼';

                    // 우측 iframe URL 연결
                    if(group.url) {
                        mainFrame.src = group.url;
                        currentInfo.innerHTML = `<strong>${group.title}</strong> 메인 화면 연동 중...`;
                    }
                };

                // 하위 시나리오 리스트 렌더링
                group.scenarios.forEach((scenario, scenarioIndex) => {
                    const itemDiv = document.createElement('div');
                    itemDiv.className = 'scenario-item';

                    const infoDiv = document.createElement('div');
                    infoDiv.className = 'scenario-info';
                    infoDiv.innerHTML = `<span class="scenario-id">${scenario.sId}</span> ${scenario.name}`;
                    
                    // 하위 시나리오 클릭 시 화면 이동 없이 상단 텍스트만 변경 (어떤 QA 진행 중인지 표시용)
                    infoDiv.onclick = () => {
                        currentInfo.innerHTML = `<strong>${group.title}</strong> > 현재 테스트 항목 : [${scenario.sId}] ${scenario.name}`;
                    };

                    const btnGroup = document.createElement('div');
                    btnGroup.className = 'btn-group';

                    const editBtn = document.createElement('button');
                    editBtn.textContent = '수정';
                    editBtn.onclick = (e) => {
                        e.stopPropagation(); // 부모 클릭 방지
                        const newId = prompt('시나리오 ID를 입력하세요:', scenario.sId);
                        const newName = prompt('업무 시나리오 내용을 입력하세요:', scenario.name);
                        
                        if(newId && newName !== null) {
                            menuData[groupIndex].scenarios[scenarioIndex] = { 
                                sId: newId, 
                                name: newName
                            };
                            renderMenu();
                            
                            // 수정 후 해당 아코디언 열림 상태 유지
                            const currentListDiv = container.querySelectorAll('.menu-list')[groupIndex];
                            currentListDiv.classList.add('active');
                            container.querySelectorAll('.menu-header span:last-child')[groupIndex].textContent = '▲';
                        }
                    };

                    const deleteBtn = document.createElement('button');
                    deleteBtn.textContent = '삭제';
                    deleteBtn.onclick = (e) => {
                        e.stopPropagation();
                        if(confirm(`[${scenario.name}] 항목을 삭제하시겠습니까?`)) {
                            menuData[groupIndex].scenarios.splice(scenarioIndex, 1);
                            renderMenu();
                            
                            const currentListDiv = container.querySelectorAll('.menu-list')[groupIndex];
                            currentListDiv.classList.add('active');
                            container.querySelectorAll('.menu-header span:last-child')[groupIndex].textContent = '▲';
                        }
                    };

                    btnGroup.appendChild(editBtn);
                    btnGroup.appendChild(deleteBtn);

                    itemDiv.appendChild(infoDiv);
                    itemDiv.appendChild(btnGroup);
                    listDiv.appendChild(itemDiv);
                });

                // 항목 추가 버튼
                const addBtn = document.createElement('button');
                addBtn.className = 'btn-add';
                addBtn.textContent = '+ 새 시나리오 추가';
                addBtn.onclick = () => {
                    const addId = prompt('새로운 시나리오 ID를 입력하세요 (예: DB-99):');
                    if(!addId) return;
                    const addName = prompt('업무 시나리오 내용을 입력하세요:');
                    if(!addName) return;

                    menuData[groupIndex].scenarios.push({
                        sId: addId,
                        name: addName
                    });
                    renderMenu();
                    
                    const currentListDiv = container.querySelectorAll('.menu-list')[groupIndex];
                    currentListDiv.classList.add('active');
                    container.querySelectorAll('.menu-header span:last-child')[groupIndex].textContent = '▲';
                };
                listDiv.appendChild(addBtn);

                groupDiv.appendChild(headerDiv);
                groupDiv.appendChild(listDiv);
                container.appendChild(groupDiv);
            });
        }

        renderMenu();
    </script>
</body>
</html>
